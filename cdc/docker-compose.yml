services:
  # ==========================================
  # 1. Oracle Databases (แยก 4 แอป + แมปพอร์ต)
  # ==========================================
  oracle-ecommerce:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-ecommerce
    environment:
      - ORACLE_PWD=${ORACLE_ECOM_PWD:-EcomPwd123!}
    ports:
      - "1521:1521"
    volumes:
      - oracle_ecommerce_data:/opt/oracle/oradata
    networks:
      - datalake-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s / as sysdba | grep -q '1'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  oracle-wallet:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-wallet
    environment:
      - ORACLE_PWD=${ORACLE_WALLET_PWD:-WalletPwd123!}
    ports:
      - "11521:1521"
    volumes:
      - oracle_wallet_data:/opt/oracle/oradata
    networks:
      - datalake-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s / as sysdba | grep -q '1'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  oracle-crm:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-crm
    environment:
      - ORACLE_PWD=${ORACLE_CRM_PWD:-CrmPwd123!}
    ports:
      - "21521:1521"
    volumes:
      - oracle_crm_data:/opt/oracle/oradata
    networks:
      - datalake-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s / as sysdba | grep -q '1'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  oracle-audit:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-audit
    environment:
      - ORACLE_PWD=${ORACLE_AUDIT_PWD:-AuditPwd123!}
    ports:
      - "31521:1521"
    volumes:
      - oracle_audit_data:/opt/oracle/oradata
    networks:
      - datalake-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s / as sysdba | grep -q '1'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ==========================================
  # 2. PostgreSQL (Data Lake ปลายทาง)
  # ==========================================
  postgres-datalake:
    image: postgres:16
    container_name: postgres-datalake
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-datalake_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-DataLakePwd123!}
      - POSTGRES_DB=${POSTGRES_DB:-datalake_db}
    ports:
      - "5432:5432"
    command: >
      postgres
      -c synchronous_commit=off
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=15min
      -c max_wal_size=16GB
      -c min_wal_size=2GB
      -c wal_buffers=64MB
      -c shared_buffers=2GB
      -c work_mem=64MB
    volumes:
      - pg_datalake_data:/var/lib/postgresql/data
    networks:
      - datalake-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datalake_admin} -d ${POSTGRES_DB:-datalake_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 3. High-Performance Lake Ingestion Receiver
  # ==========================================
  lake-receiver:
    build:
      context: ./receiver
      dockerfile: Dockerfile
    container_name: lake-receiver
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      - PG_HOST=postgres-datalake
      - PG_PORT=5432
      - PG_USER=${POSTGRES_USER:-datalake_admin}
      - PG_PWD=${POSTGRES_PASSWORD:-DataLakePwd123!}
      - PG_DB=${POSTGRES_DB:-datalake_db}
      - BATCH_SIZE=5000
      - FLUSH_INTERVAL=0.05
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--http", "h11"]
    depends_on:
      postgres-datalake:
        condition: service_healthy
    volumes:
      - ./receiver/main.py:/app/main.py
      - ./receiver/cdc_pb2.py:/app/cdc_pb2.py
      - ./receiver/cdc_pb2_grpc.py:/app/cdc_pb2_grpc.py
    networks:
      - datalake-net

  # ==========================================
  # 4. Debezium Server Standalone (No Kafka - Direct gRPC Stream)
  # ==========================================
  debezium-server-wallet:
    image: quay.io/debezium/server:2.4
    container_name: debezium-server-wallet
    restart: unless-stopped
    volumes:
      - ./lib/ojdbc11.jar:/debezium/lib/ojdbc11.jar:ro
      - ./lib/debezium-server-http-2.4.2.Final.jar:/debezium/lib/debezium-server-http-2.4.2.Final.jar:ro
      - ./conf/wallet/application.properties:/debezium/conf/application.properties:ro
      - ./data/wallet:/debezium/data
    depends_on:
      oracle-wallet:
        condition: service_healthy
      lake-receiver:
        condition: service_started
    networks:
      - datalake-net

  debezium-server-ecommerce:
    image: quay.io/debezium/server:2.4
    container_name: debezium-server-ecommerce
    restart: unless-stopped
    volumes:
      - ./lib/ojdbc11.jar:/debezium/lib/ojdbc11.jar:ro
      - ./lib/debezium-server-http-2.4.2.Final.jar:/debezium/lib/debezium-server-http-2.4.2.Final.jar:ro
      - ./conf/ecommerce/application.properties:/debezium/conf/application.properties:ro
      - ./data/ecommerce:/debezium/data
    depends_on:
      oracle-ecommerce:
        condition: service_healthy
      lake-receiver:
        condition: service_started
    networks:
      - datalake-net

  debezium-server-crm:
    image: quay.io/debezium/server:2.4
    container_name: debezium-server-crm
    restart: unless-stopped
    volumes:
      - ./lib/ojdbc11.jar:/debezium/lib/ojdbc11.jar:ro
      - ./lib/debezium-server-http-2.4.2.Final.jar:/debezium/lib/debezium-server-http-2.4.2.Final.jar:ro
      - ./conf/crm/application.properties:/debezium/conf/application.properties:ro
      - ./data/crm:/debezium/data
    depends_on:
      oracle-crm:
        condition: service_healthy
      lake-receiver:
        condition: service_started
    networks:
      - datalake-net

  debezium-server-audit:
    image: quay.io/debezium/server:2.4
    container_name: debezium-server-audit
    restart: unless-stopped
    volumes:
      - ./lib/ojdbc11.jar:/debezium/lib/ojdbc11.jar:ro
      - ./lib/debezium-server-http-2.4.2.Final.jar:/debezium/lib/debezium-server-http-2.4.2.Final.jar:ro
      - ./conf/audit/application.properties:/debezium/conf/application.properties:ro
      - ./data/audit:/debezium/data
    depends_on:
      oracle-audit:
        condition: service_healthy
      lake-receiver:
        condition: service_started
    networks:
      - datalake-net

volumes:
  oracle_ecommerce_data:
  oracle_wallet_data:
  oracle_crm_data:
  oracle_audit_data:
  pg_datalake_data:

networks:
  datalake-net:
    driver: bridge