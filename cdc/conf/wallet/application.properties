# ==========================================
# Debezium Source Configuration (Oracle Wallet)
# ==========================================
debezium.source.connector.class=io.debezium.connector.oracle.OracleConnector
debezium.source.database.hostname=oracle-wallet
debezium.source.database.port=1521
debezium.source.database.user=c##dbzuser
debezium.source.database.password=dbz_password
debezium.source.database.dbname=FREE
debezium.source.database.pdb.name=FREEPDB1
debezium.source.topic.prefix=wallet_server
debezium.source.table.include.list=.*WALLET_APP\\..*
debezium.source.snapshot.locking.mode=none
debezium.source.decimal.handling.mode=double

# Performance Tuning (LogMiner High Throughput)
debezium.source.max.batch.size=10000
debezium.source.max.queue.size=50000
debezium.source.poll.interval.ms=100
debezium.source.log.mining.batch.size.min=5000
debezium.source.log.mining.batch.size.default=20000
debezium.source.log.mining.batch.size.max=100000
debezium.source.log.mining.sleep.time.default.ms=200

# Non-Kafka Storage (File Offset & Schema History)
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/wallet-offsets.dat
debezium.source.offset.flush.interval.ms=5000

debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/wallet-schema-history.dat

# Format & Sink Configuration (gRPC Stream to lake-receiver)
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

debezium.sink.type=http
debezium.sink.grpc.host=lake-receiver
debezium.sink.grpc.port=50051
debezium.sink.grpc.app.name=wallet

